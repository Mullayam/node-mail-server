# Whole mail stack. Run from the repo root:
#
#   docker compose -f deploy/docker-compose.yml up -d                  # inbound + outbound + relay + redis
#   docker compose -f deploy/docker-compose.yml --profile imap up -d   # also imap
#
# Port ownership: inbound (Node) publishes 25, outbound (KumoMTA) publishes 587,
# relay (KumoMTA) publishes 2587.
# The Node app still opens 587 inside its container, but it isn't published.
# To send through the Node path instead, publish 587 on inbound and remove it from outbound.

name: node-mail-server

services:
  # Receiving MX: SMTP on :25, DKIM/SPF/DMARC checks, PGP at rest.
  inbound:
    build: ../server
    env_file: ../server/.env
    environment:
      MAIL_DATA_DIR: /app/data
    ports:
      - "25:25"
    volumes:
      # The server's SQLite database (data/server.db, one table per feature), so it survives a rebuild.
      - inbound-data:/app/data:rw
    restart: unless-stopped

  # Sending MTA (KumoMTA): authenticated submission on :587, DKIM, queues, delivery.
  outbound:
    image: ghcr.io/kumocorp/kumomta:latest
    env_file: ../outbound/.env
    ports:
      - "587:587"
    volumes:
      - ../outbound/policy:/opt/kumomta/etc/policy:ro
      - kumo-spool:/var/spool/kumomta
      - kumo-logs:/var/log/kumomta
      # Only needed when DKIM_BACKEND=file (keys at dkim/<domain>/<selector>.key):
      # - ../outbound/dkim:/opt/kumomta/etc/dkim:ro
    depends_on:
      - redis
    restart: unless-stopped

  # Public SMTP relay (KumoMTA) on :2587: AUTH required, each account's events go to its own webhook.
  relay:
    image: ghcr.io/kumocorp/kumomta:latest
    env_file: ../relay/.env
    ports:
      - "2587:2587"
    volumes:
      - ../relay/policy:/opt/kumomta/etc/policy:ro
      - relay-spool:/var/spool/kumomta
      - relay-logs:/var/log/kumomta
      # Only needed when DKIM_BACKEND=file (keys at dkim/<domain>/<selector>.key):
      # - ../relay/dkim:/opt/kumomta/etc/dkim:ro
      # Only needed when RELAY_TLS_CERT / RELAY_TLS_KEY are set:
      # - ../relay/tls:/opt/kumomta/etc/tls:ro
    depends_on:
      - redis
    restart: unless-stopped

  # Mailbox access (Go + Gluon). Opt-in. Mail is stored in Pebble under /data/mail.
  # Config: server/imap/conf/imap.xml and users.xml (copy from the *.example.xml files).
  # TLS: put fullchain.pem and privkey.pem in server/imap/tls and enable <tls> in imap.xml.
  # After editing config or renewing certs: docker compose -f deploy/docker-compose.yml exec imap imapctl reload
  imap:
    profiles: ["imap"]
    build: ../server/imap
    ports:
      - "127.0.0.1:143:143" # plain IMAP (STARTTLS when <tls> is set): local only
      - "993:993" # IMAPS: only answers when <tls> is set in imap.xml
    volumes:
      # imap.xml and users.xml. Read-write: imapctl user add/update/delete saves users.xml.
      # On a Linux host the folder must be writable by uid 1000: sudo chown -R 1000:1000 server/imap/conf
      - ../server/imap/conf:/etc/imap:rw
      # Certificate and private key. Read-only: the server never writes them.
      - ../server/imap/tls:/etc/ssl/imap:ro
      # Pebble mail store (/data/mail) and Gluon's cache (/data/gluon). Back this up.
      - imap-data:/data:rw
    restart: unless-stopped

  # Shared by outbound and relay (DKIM_BACKEND=redis). Not published.
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  inbound-data:
  kumo-spool:
  kumo-logs:
  relay-spool:
  relay-logs:
  imap-data:
  redis-data:
