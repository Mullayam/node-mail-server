# ============================================
# PROOFPOINT - Enterprise email security
# ============================================
[provider."proofpoint"]
match = [{ MXSuffix = ".pphosted.com" }]
connection_limit = 5
max_connection_rate = "5/min"
max_message_rate = "50/min"
max_deliveries_per_connection = 30
enable_tls = "Opportunistic"

[[provider."proofpoint".automation]]
regex = ['''Blocked''', '''451.*try again''']
action = [
    { SetConfig = { name = "max_message_rate", value = "10/min" } },
    { SetConfig = { name = "connection_limit", value = 2 } },
