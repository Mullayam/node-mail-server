# Custom Traffic Shaping for Unosend
# /opt/kumomta/etc/policy/shaping.toml
# NOT LOADED YET: nothing in init.lua wires this up via get_egress_path_config.
# Until it is, only the per-domain rate in queue.lua applies.
# Updated 2026-02-11: Improved ISP-specific rules

# ============================================
# GMAIL / GOOGLE - Conservative for warmup
# ============================================
[provider."google"]
match = [{ MXSuffix = ".google.com" }, { MXSuffix = ".googlemail.com" }]
connection_limit = 8
max_connection_rate = "10/min"
max_message_rate = "120/min"
max_deliveries_per_connection = 50
enable_tls = "Required"
enable_mta_sts = true
idle_timeout = "30s"

[[provider."google".automation]]
regex = [
    '''4\.\d\.\d .* try again later''',
    '''421.*too many connections''',
    '''Our system has detected an unusual rate''',
]
action = [
    { SetConfig = { name = "max_message_rate", value = "30/min" } },
    { SetConfig = { name = "connection_limit", value = 2 } },
]
duration = "2h"

# ============================================
# MICROSOFT - Outlook, Hotmail, Live
# ============================================
[provider."microsoft"]
match = [
    { MXSuffix = ".outlook.com" },
    { MXSuffix = ".hotmail.com" },
    { MXSuffix = ".protection.outlook.com" },
]
connection_limit = 6
max_connection_rate = "8/min"
max_message_rate = "80/min"
max_deliveries_per_connection = 50
enable_tls = "Required"
enable_mta_sts = true
enable_dane = true

[[provider."microsoft".automation]]
regex = [
    '''421 RP-00\d''',
    '''Service not available''',
    '''temporarily deferred''',
]
action = [
    { SetConfig = { name = "max_message_rate", value = "20/min" } },
    { SetConfig = { name = "connection_limit", value = 2 } },
]
duration = "4h"

# ============================================
# COMCAST - Large US ISP
# ============================================
[provider."comcast"]
match = [{ MXSuffix = ".comcast.net" }]
connection_limit = 3
max_connection_rate = "3/min"
max_message_rate = "20/min"
max_deliveries_per_connection = 20
enable_tls = "Opportunistic"

[[provider."comcast".automation]]
regex = ['''421.*too many''', '''RL0\d{3}''']
action = [
    { SetConfig = { name = "max_message_rate", value = "5/min" } },
    { SetConfig = { name = "connection_limit", value = 1 } },
]
duration = "4h"

# ============================================
# ATT - AT&T
