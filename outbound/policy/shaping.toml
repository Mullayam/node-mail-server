# ============================================
# DEFAULT - All other domains
# ============================================
["default"]
connection_limit = 8
max_connection_rate = "15/min"
max_deliveries_per_connection = 50
max_message_rate = "100/min"
idle_timeout = "60s"
enable_tls = "Opportunistic"
consecutive_connection_failures_before_delay = 50

[["default".automation]]
regex = [
    '''temporarily deferred''',
    '''rate limit''',
    '''too many connections''',
    '''try again later''',
]
action = [
    { SetConfig = { name = "max_message_rate", value = "20/min" } },
    { SetConfig = { name = "connection_limit", value = 2 } },
]
duration = "2h"
